services:
  djinn:
    build:
      context: ../../
      dockerfile: Dockerfile.djinn
    # Longer than COORDIN8_SHUTDOWN_GRACE_SECS (default 20) so the Djinn can
    # finish its graceful drain; Docker's own default is only 10s.
    stop_grace_period: 25s
    ports:
      - "${COORDIN8_PUBLISH_HOST:-127.0.0.1}:9002:9002"
      - "${COORDIN8_PUBLISH_HOST:-127.0.0.1}:9003:9003"
      - "${COORDIN8_PUBLISH_HOST:-127.0.0.1}:9004:9004"
      - "${COORDIN8_PUBLISH_HOST:-127.0.0.1}:9005:9005"
      - "${COORDIN8_PUBLISH_HOST:-127.0.0.1}:9006:9006"
      - "${COORDIN8_PUBLISH_HOST:-127.0.0.1}:9100-9200:9100-9200"
    environment:
      RUST_LOG: "info"
      PROXY_BIND_HOST: "0.0.0.0"
      COORDIN8_ADVERTISE_HOST: "djinn"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/9002'"]
      interval: 5s
      retries: 10
    networks:
      - auction-net

  auction-service:
    build:
      context: ../../
      dockerfile: examples/auction-house/Dockerfile.auction-service
    depends_on:
      djinn:
        condition: service_healthy
    environment:
      COORDIN8_REGISTRY: djinn:9002
      PORT: "8080"
    ports:
      - "${COORDIN8_PUBLISH_HOST:-127.0.0.1}:8080:8080"
    restart: on-failure
    networks:
      - auction-net

  settlement-engine:
    build:
      context: ../../
      dockerfile: examples/auction-house/Dockerfile.settlement-engine
    depends_on:
      djinn:
        condition: service_healthy
    environment:
      COORDIN8_REGISTRY: djinn:9002
    restart: on-failure
    networks:
      - auction-net

  auction-board:
    build:
      context: ../../
      dockerfile: examples/auction-house/Dockerfile.auction-board
    depends_on:
      djinn:
        condition: service_healthy
      auction-service:
        condition: service_started
    environment:
      COORDIN8_REGISTRY: djinn:9002
      PORT: "3000"
      AUCTION_SERVICE: "http://auction-service:8080"
    ports:
      - "${COORDIN8_PUBLISH_HOST:-127.0.0.1}:3000:3000"
    restart: on-failure
    networks:
      - auction-net

networks:
  auction-net:
