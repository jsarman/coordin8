[tools]
rust = "1.94.1"
go   = "1.22"
node = "23"
java = "openjdk-21"

[env]
# Override the Makefile's legacy Go path so mise-managed `go` is used.
GO = "go"
# CGO's external linker on this Xcode/ld toolchain drops LC_UUID from Mach-O
# binaries that import `net` (dyld: "missing LC_UUID load command" at launch).
# Go's SDK/CLI/examples don't need cgo, so build with the internal linker.
CGO_ENABLED = "0"

# ── Tasks ────────────────────────────────────────────────────────────────────

[tasks.proto]
description = "Regenerate proto stubs for all languages"
run = "make proto"

[tasks.build]
description = "Build Djinn (release) + CLI"
run = "make build"

[tasks.build-djinn]
description = "Build Djinn only (dev profile)"
run = "cd djinn && cargo build"

[tasks.build-examples]
description = "Build all example binaries"
run = "make build-examples"

[tasks.test]
description = "Run all tests (Rust + Go SDK)"
run = "make test"

[tasks.test-rust]
description = "Run Rust tests only"
run = "cd djinn && cargo test --all"

[tasks.test-go]
description = "Run Go SDK tests only"
run = "cd sdks/go && go test ./..."

[tasks.lint]
description = "Lint everything (clippy, fmt, go vet)"
run = "make lint"

[tasks.clean]
description = "Remove all build artifacts"
run = "make clean"

[tasks.djinn]
description = "Start Djinn locally (dev)"
run = "cd djinn && cargo run"

[tasks.up]
description = "Start full stack in Docker (Djinn + greeter)"
run = "docker compose up --build"

[tasks.down]
description = "Stop Docker stack"
run = "docker compose down"

[tasks.up-auth]
description = "Start full stack in Docker with JWT auth enabled (see docker-compose.auth.yml)"
run = """
scripts/gen-auth-env.sh .env.auth-bundled greeter
docker compose -f docker-compose.yml -f docker-compose.auth.yml --env-file .env.auth-bundled up --build
"""

[tasks.up-split]
description = "Start split-mode stack in Docker (registry/event/space/txn/proxy, one container each)"
run = "docker compose -f docker-compose.split.yml up --build"

[tasks.up-split-auth]
description = "Start split-mode stack in Docker with JWT auth enabled (see docker-compose.split.auth.yml)"
run = """
scripts/gen-auth-env.sh .env.auth-split
docker compose -f docker-compose.split.yml -f docker-compose.split.auth.yml --env-file .env.auth-split up --build
"""

[tasks.down-split]
description = "Stop split-mode Docker stack"
run = "docker compose -f docker-compose.split.yml down"

[tasks.demo-events]
description = "Run market-watch EventMgr demo (requires live Djinn on :9005)"
run = "cd examples/market-watch && go run ."

[tasks.demo-txn]
description = "Run double-entry TransactionMgr demo (requires live Djinn on :9004)"
run = "cd examples/double-entry && go run ."

[tasks.demo-auction]
description = "Run the Auction House polyglot demo (Java + Go + Node, own Docker stack — see examples/auction-house/README.md)"
run = "cd examples/auction-house && docker compose up --build"

[tasks.demo-auction-down]
description = "Stop the Auction House demo stack"
run = "cd examples/auction-house && docker compose down"

[tasks.demo-auction-auth]
description = "Run the Auction House demo with JWT auth enabled (see examples/auction-house/docker-compose.auth.yml)"
run = """
cd examples/auction-house
../../scripts/gen-auth-env.sh .env.auth auction-service settlement-engine auction-board
docker compose -f docker-compose.yml -f docker-compose.auth.yml --env-file .env.auth up --build
"""

[tasks.demo-greeter-go]
description = "Run the Go hello-coordin8 greeter client (requires `mise r up` or `mise r djinn` running)"
run = "cd examples/hello-coordin8/go && go run ./greeter_client"

[tasks.demo-greeter-java]
description = "Run the Java hello-coordin8 greeter client (requires `mise r up` or `mise r djinn` running)"
run = "cd examples/hello-coordin8/java && ./gradlew run --args=\"Coordin8 (Java)\""

[tasks.demo-greeter-node]
description = "Run the Node hello-coordin8 greeter client (requires `mise r up` or `mise r djinn` running)"
run = "cd examples/hello-coordin8/node && npm install && npx ts-node src/greeter-client.ts"
